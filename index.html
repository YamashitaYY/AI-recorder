<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BizLog - AI Voice Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        brand: '#1C1C1E',
                        accent: '#FF3B30',
                        bg: '#F2F2F7',
                        surface: '#FFFFFF' 
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-active { color: #1C1C1E; font-weight: 800; border-bottom: 2px solid #1C1C1E; }
        .tab-inactive { color: #8E8E93; font-weight: 600; border-bottom: 2px solid transparent; }
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-bg flex justify-center text-gray-900 h-screen overflow-hidden antialiased" onload="initApp()">
    <div class="w-full max-w-md bg-bg h-full flex flex-col relative shadow-2xl overflow-hidden">
        
        <header class="pt-12 pb-3 px-6 bg-surface z-20 shrink-0 rounded-b-3xl shadow-sm relative">
            <div class="flex items-center justify-between mb-5">
                <div>
                    <h1 class="text-[22px] font-black tracking-tight text-brand">BizLog</h1>
                    <p class="text-[11px] font-bold text-gray-400 tracking-wider mt-0.5 uppercase">AI Voice Note & Tasks</p>
                </div>
                <button onclick="openSettingsModal()" class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center hover:bg-gray-100 transition shadow-sm border border-gray-100">
                    <i data-lucide="settings" class="w-5 h-5 text-gray-600"></i>
                </button>
            </div>

            <div class="flex overflow-x-auto no-scrollbar gap-2.5 pb-2" id="calendar-container"></div>
        </header>

        <div class="flex px-8 pt-3 bg-bg shrink-0 z-10">
            <button onclick="switchTab('timeline')" id="tab-timeline" class="flex-1 pb-3 text-[13px] tab-active transition-colors tracking-wide">ノート</button>
            <button onclick="switchTab('tasks')" id="tab-tasks" class="flex-1 pb-3 text-[13px] tab-inactive transition-colors tracking-wide flex items-center justify-center gap-1.5">
                タスク <span id="task-badge" class="bg-brand text-white text-[10px] px-1.5 py-0.5 rounded-full leading-none hidden font-bold shadow-sm">0</span>
            </button>
        </div>

        <main class="flex-1 overflow-y-auto no-scrollbar flex flex-col relative p-5 pb-32">
            <div id="view-timeline" class="space-y-5">
                <div id="timeline-container" class="space-y-5"></div>
            </div>
            <div id="view-tasks" class="hidden space-y-3">
                <div id="tasks-container" class="bg-surface rounded-3xl shadow-sm border border-gray-100/50 overflow-hidden"></div>
            </div>
        </main>

        <div class="absolute bottom-8 left-0 right-0 flex justify-center z-30 pointer-events-none">
            <button onclick="openMemoModal()" class="pointer-events-auto flex items-center gap-2.5 bg-brand text-white px-7 py-4 rounded-full shadow-2xl shadow-brand/40 hover:scale-105 active:scale-95 transition-all">
                <i data-lucide="plus" class="w-5 h-5"></i>
                <span class="text-[15px] font-bold tracking-wide">記録を追加</span>
            </button>
        </div>

        <div id="memo-modal" class="fixed inset-0 bg-brand/40 z-50 hidden flex flex-col justify-end backdrop-blur-md transition-opacity">
            <div id="memo-modal-content" class="bg-surface w-full max-w-md mx-auto rounded-t-[2.5rem] p-7 transform translate-y-full transition-transform duration-300 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-black text-brand tracking-tight">新しいノート</h2>
                    <button onclick="closeMemoModal()" class="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
                        <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                    </button>
                </div>
                
                <p class="text-[12px] text-gray-500 font-medium mb-5">音声ファイル（.m4a等）をアップロードするか、テキストを入力してください。</p>
                
                <div class="mb-5">
                    <div class="relative bg-gray-50 border-2 border-dashed border-gray-200 rounded-3xl p-6 hover:bg-gray-100 transition cursor-pointer flex flex-col items-center justify-center group" onclick="document.getElementById('audio-file').click()">
                        <div class="w-14 h-14 bg-white rounded-full shadow-sm border border-gray-100 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                            <i data-lucide="upload-cloud" id="upload-icon" class="w-6 h-6 text-brand"></i>
                        </div>
                        <span class="text-[14px] font-bold text-gray-700 text-center" id="file-name-display">音声ファイルを選択</span>
                        <input type="file" id="audio-file" accept="audio/*,.m4a,.mp4,.mp3,.wav" class="hidden" onchange="handleFileSelect(this)">
                    </div>
                </div>

                <div class="flex items-center gap-3 mb-5">
                    <div class="flex-1 h-px bg-gray-200"></div>
                    <span class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">or Text</span>
                    <div class="flex-1 h-px bg-gray-200"></div>
                </div>

                <textarea id="memo-input" class="w-full h-24 bg-gray-50 border border-gray-200 rounded-2xl p-4 text-[13px] focus:outline-none focus:ring-2 focus:ring-brand focus:bg-white resize-none mb-6" placeholder="※音声を選んだ場合はここは空欄でOKです。"></textarea>
                
                <div id="loading-indicator" class="hidden flex-col items-center justify-center gap-4 py-4 mb-2">
                    <div class="relative flex items-center justify-center">
                        <div class="w-12 h-12 border-4 border-gray-100 rounded-full"></div>
                        <div class="w-12 h-12 border-4 border-brand border-t-transparent rounded-full animate-spin absolute"></div>
                    </div>
                    <span id="loading-text" class="text-[12px] font-bold text-brand animate-pulse text-center">AIが音声を解析しています...</span>
                </div>

                <div id="memo-buttons" class="flex">
                    <button onclick="analyzeData()" class="w-full bg-brand text-white font-bold py-4 rounded-2xl text-[15px] shadow-lg shadow-brand/30 active:scale-[0.98] transition-transform flex justify-center items-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5"></i> AIで要約＆タスク抽出
                    </button>
                </div>
            </div>
        </div>

        <div id="settings-modal" class="fixed inset-0 bg-brand/40 z-50 hidden flex flex-col justify-end backdrop-blur-md transition-opacity">
            <div id="settings-modal-content" class="bg-surface w-full max-w-md mx-auto rounded-t-[2.5rem] p-7 transform translate-y-full transition-transform duration-300 h-[85vh] flex flex-col shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-black text-brand tracking-tight">設定</h2>
                    <button onclick="closeSettingsModal()" class="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
                        <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                    </button>
                </div>
                
                <div class="flex-1 overflow-y-auto no-scrollbar pb-6 space-y-6">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 mb-2 tracking-wider">GEMINI API KEY (必須)</label>
                        <input type="password" id="api-key-input" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand" placeholder="AQ.xxx または AIza...">
                    </div>

                    <div class="h-px bg-gray-100"></div>

                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 mb-2 tracking-wider">連携: GOOGLE APP SCRIPT URL</label>
                        <input type="text" id="gas-url-input" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand mb-3" placeholder="https://script.google.com/...">
                        
                        <label class="block text-[11px] font-bold text-gray-400 mb-2 tracking-wider">連携: SECRET TOKEN (合言葉)</label>
                        <input type="password" id="gas-secret-input" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand" placeholder="設定した合言葉">
                        <p class="text-[10px] text-gray-400 font-medium mt-2 leading-relaxed">
                            設定すると、AIの解析後に自動でGoogleカレンダーとToDoに予定が作成されます。
                        </p>
                    </div>

                    <div class="h-px bg-gray-100"></div>

                    <div>
                        <button onclick="clearAllData()" class="w-full bg-red-50 text-red-600 font-bold py-4 rounded-xl text-[13px] flex items-center justify-center gap-2 border border-red-100 hover:bg-red-100 transition">
                            <i data-lucide="alert-circle" class="w-4 h-4"></i> すべてのデータを削除
                        </button>
                    </div>
                </div>

                <div class="pt-4 mt-auto">
                    <button onclick="saveSettings()" class="w-full bg-brand text-white font-bold py-4 rounded-2xl text-[15px] shadow-lg active:scale-[0.98] transition-transform">
                        保存して閉じる
                    </button>
                </div>
            </div>
        </div>

        <div id="toast" class="fixed top-14 left-1/2 transform -translate-x-1/2 bg-brand text-white text-[13px] font-bold px-6 py-3.5 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 z-[100] text-center w-max max-w-[90%]">
            メッセージ
        </div>

    </div>

    <script>
        lucide.createIcons();

        let appState = { 
            apiKey: '', 
            gasUrl: '', 
            gasSecret: '', 
            logs: [],
            selectedDate: '' 
        };
        let selectedFileObj = null; 

        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;
        }

        function initApp() {
            appState.selectedDate = getTodayStr();
            const savedKey = localStorage.getItem('bizlog_apikey');
            if (savedKey) appState.apiKey = savedKey;
            const savedGasUrl = localStorage.getItem('bizlog_gas_url');
            if (savedGasUrl) appState.gasUrl = savedGasUrl;
            const savedGasSecret = localStorage.getItem('bizlog_gas_secret');
            if (savedGasSecret) appState.gasSecret = savedGasSecret;
            const savedLogs = localStorage.getItem('bizlog_logs');
            if (savedLogs) {
                appState.logs = JSON.parse(savedLogs);
            }
            renderData();
            if (!savedKey) setTimeout(() => openSettingsModal(), 500);
        }

        function saveData() {
            localStorage.setItem('bizlog_apikey', appState.apiKey);
            localStorage.setItem('bizlog_gas_url', appState.gasUrl);
            localStorage.setItem('bizlog_gas_secret', appState.gasSecret);
            localStorage.setItem('bizlog_logs', JSON.stringify(appState.logs));
            renderData();
        }

        function switchTab(tab) {
            document.getElementById('view-timeline').classList.add('hidden');
            document.getElementById('view-tasks').classList.add('hidden');
            document.getElementById('tab-timeline').classList.replace('tab-active', 'tab-inactive');
            document.getElementById('tab-tasks').classList.replace('tab-active', 'tab-inactive');
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.replace('tab-inactive', 'tab-active');
        }

        function showMessage(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        function openSettingsModal() {
            document.getElementById('api-key-input').value = appState.apiKey;
            document.getElementById('gas-url-input').value = appState.gasUrl;
            document.getElementById('gas-secret-input').value = appState.gasSecret;
            const modal = document.getElementById('settings-modal');
            const content = document.getElementById('settings-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('translate-y-full'), 10);
        }
        function closeSettingsModal() {
            const modal = document.getElementById('settings-modal');
            const content = document.getElementById('settings-modal-content');
            content.classList.add('translate-y-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
        function saveSettings() {
            appState.apiKey = document.getElementById('api-key-input').value.trim();
            appState.gasUrl = document.getElementById('gas-url-input').value.trim();
            appState.gasSecret = document.getElementById('gas-secret-input').value.trim();
            saveData();
            closeSettingsModal();
            showMessage('設定を保存しました');
        }
        function clearAllData() {
            if(confirm('完全にすべての記録とタスクを削除しますか？')) {
                appState.logs = [];
                saveData();
                closeSettingsModal();
                showMessage('データを削除しました');
            }
        }
        function openMemoModal() {
            if (!appState.apiKey) {
                showMessage('設定からAPIキーを登録してください');
                openSettingsModal();
                return;
            }
            resetFileInput();
            document.getElementById('memo-input').value = '';
            document.getElementById('memo-buttons').classList.remove('hidden');
            document.getElementById('loading-indicator').classList.add('hidden');
            document.getElementById('loading-indicator').classList.remove('flex');
            const modal = document.getElementById('memo-modal');
            const content = document.getElementById('memo-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('translate-y-full'), 10);
        }
        function closeMemoModal() {
            const modal = document.getElementById('memo-modal');
            const content = document.getElementById('memo-modal-content');
            content.classList.add('translate-y-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                selectedFileObj = input.files[0];
                document.getElementById('file-name-display').innerHTML = `<span class="text-brand font-black">${selectedFileObj.name}</span><br><span class="text-[11px] font-medium text-gray-400">${(selectedFileObj.size / 1024 / 1024).toFixed(2)} MB</span>`;
                const icon = document.getElementById('upload-icon');
                icon.setAttribute('data-lucide', 'check');
                icon.classList.add('text-brand');
                lucide.createIcons();
            }
        }
        function resetFileInput() {
            selectedFileObj = null;
            const fileInput = document.getElementById('audio-file');
            if(fileInput) fileInput.value = '';
            document.getElementById('file-name-display').innerHTML = '音声ファイルを選択';
            const icon = document.getElementById('upload-icon');
            icon.setAttribute('data-lucide', 'upload-cloud');
            icon.classList.add('text-brand');
            lucide.createIcons();
        }

        function selectDate(dateStr) {
            appState.selectedDate = dateStr;
            renderData();
        }

        // --- 絶対に抽出失敗を許さない AI解析処理 ---
        async function analyzeData() {
            const text = document.getElementById('memo-input').value.trim();
            if (!text && !selectedFileObj) {
                showMessage("音声かテキストを入力してください。");
                return;
            }

            document.getElementById('memo-buttons').classList.add('hidden');
            document.getElementById('loading-indicator').classList.remove('hidden');
            document.getElementById('loading-indicator').classList.add('flex');
            const loadingText = document.getElementById('loading-text');

            try {
                let fileUri = null;
                let mimeType = null;

                if (selectedFileObj) {
                    loadingText.innerHTML = "音声をサーバーに安全に送信中...<br><span class='text-[10px] font-normal text-gray-400'>ファイルサイズによっては数十秒かかります</span>";
                    mimeType = selectedFileObj.type || (selectedFileObj.name.toLowerCase().endsWith('.m4a') ? 'audio/mp4' : 'audio/mp3');

                    const uploadUrl = `https://generativelanguage.googleapis.com/upload/v1beta/files?key=${appState.apiKey}`;
                    const uploadResponse = await fetch(uploadUrl, {
                        method: 'POST',
                        headers: {
                            'X-Goog-Upload-Protocol': 'raw',
                            'X-Goog-Upload-Command': 'start, upload, finalize',
                            'X-Goog-Upload-Header-Content-Length': selectedFileObj.size.toString(),
                            'X-Goog-Upload-Header-Content-Type': mimeType,
                            'Content-Type': mimeType
                        },
                        body: selectedFileObj
                    });

                    const uploadResult = await uploadResponse.json();
                    if (!uploadResponse.ok) throw new Error(`送信エラー: ${uploadResult.error?.message}`);
                    
                    fileUri = uploadResult.file.uri;
                    loadingText.innerHTML = "送信完了！AIが文字起こしと要約を作成中...<br><span class='text-[10px] font-normal text-gray-400'>※画面を閉じずにお待ちください</span>";
                } else {
                    loadingText.innerHTML = "テキストを解析中...";
                }

                let generateUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${appState.apiKey}`;
                
                // 【重要】AIに「サボるな」と強く命令するプロンプト
                const prompt = `
【重要・厳守】
以下の情報（音声またはテキスト）を解析し、必ず以下の見出しタグ（#）を用いたフォーマットで出力してください。
特に「#TRANSCRIPT」は絶対に省略せず、音声の最初から最後までの完全な全文文字起こしを出力してください。
JSON形式や不要な装飾（Markdownのコードブロック等）は使わないでください。

#TITLE
(内容を表す短いタイトル)

#SUMMARY
- (重要なポイントの要約1)
- (重要なポイントの要約2)

#DETAILS
(詳細な内容、決定事項などのまとめ文章。改行を含めて読みやすく)

#TASKS
- (具体的なタスク1)
- (具体的なタスク2)

#TRANSCRIPT
(ここに音声の完全な文字起こし全文を一言一句漏らさず出力してください。絶対に省略しないでください。)
`;
                let parts = [{ text: prompt }];
                if (fileUri) parts.push({ fileData: { mimeType: mimeType, fileUri: fileUri } });

                let response = await fetch(generateUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ parts: parts }],
                        generationConfig: {
                            temperature: 0.2,
                            maxOutputTokens: 8192
                        }
                    })
                });

                let resData = await response.json();
                if (!response.ok) throw new Error(`AIエラー: ${resData.error?.message}`);

                const rawText = resData.candidates[0].content.parts[0].text;

                // 【重要】AIがどんな書き方をしても確実に抽出する正規表現
                const getSection = (text, currentHeader, nextHeaders) => {
                    const nextPattern = nextHeaders.length > 0 ? `|\\n#{1,3}\\s*(?:${nextHeaders.join('|')})` : '';
                    const regex = new RegExp(`#{1,3}\\s*${currentHeader}[:：]?\\s*\\n([\\s\\S]*?)(?=\\n#{1,3}\\s*(?:${nextHeaders.join('|')})|$)`, 'i');
                    const match = text.match(regex);
                    return match ? match[1].trim() : '';
                };

                const titleStr = getSection(rawText, 'TITLE', ['SUMMARY', 'DETAILS', 'TASKS', 'TRANSCRIPT']) || '無題の記録';
                const summaryStr = getSection(rawText, 'SUMMARY', ['DETAILS', 'TASKS', 'TRANSCRIPT']);
                const detailsStr = getSection(rawText, 'DETAILS', ['TASKS', 'TRANSCRIPT']);
                const tasksStr = getSection(rawText, 'TASKS', ['TRANSCRIPT']);
                
                // 【絶対防御】TRANSCRIPTが見つからなかった場合、AIの生出力をそのままブチ込む
                let transcriptStr = getSection(rawText, 'TRANSCRIPT', []) || getSection(rawText, '文字起こし', []);
                if (!transcriptStr) {
                    transcriptStr = "【AIが指定フォーマットを無視しました。以下の生データを確認してください】\n\n" + rawText;
                }

                const summaries = summaryStr.split('\n').map(s => s.replace(/^[-*・]\s*/, '').trim()).filter(s => s);
                const tasksText = tasksStr.split('\n').map(s => s.replace(/^[-*・]\s*/, '').trim()).filter(s => s);

                const newLogId = Date.now().toString();
                const tasks = tasksText.map((t, i) => ({
                    id: `${newLogId}_task_${i}`,
                    text: t,
                    completed: false,
                    sourceLogId: newLogId
                }));

                const newLog = {
                    id: newLogId,
                    time: new Date().toISOString(),
                    title: titleStr,
                    summaries: summaries,
                    details: detailsStr,
                    fullTranscript: transcriptStr,
                    tasks: tasks
                };

                appState.logs.unshift(newLog);
                appState.selectedDate = getTodayStr();
                saveData();
                closeMemoModal();

                if (appState.gasUrl && appState.gasSecret) {
                    showMessage("解析完了！\n続けてカレンダーとToDoに登録中...");
                    const payload = {
                        secretToken: appState.gasSecret,
                        title: newLog.title,
                        details: newLog.details,
                        tasks: tasks.map(t => t.text)
                    };
                    fetch(appState.gasUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    })
                    .then(r => r.json())
                    .then(data => {
                        if(data.status === 'success') showMessage("✨ カレンダーとToDoに登録しました！");
                        else showMessage("連携エラー: " + data.message);
                    })
                    .catch(err => showMessage("連携通信に失敗しました。"));
                } else {
                    showMessage("AIの記録が完了しました！");
                }

            } catch (error) {
                console.error(error);
                alert(`処理が中断されました。\n\n【原因】\n${error.message}`);
                document.getElementById('memo-buttons').classList.remove('hidden');
                document.getElementById('loading-indicator').classList.add('hidden');
            }
        }

        // --- UI描画処理 ---
        function renderData() {
            renderCalendar();
            renderTimeline();
            renderTasks();
            lucide.createIcons();
        }

        function getLogDateStr(isoString) {
            const d = new Date(isoString);
            return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;
        }
        function formatTimeHM(isoString) {
            const d = new Date(isoString);
            return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-container');
            const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const datesWithData = new Set(appState.logs.map(log => getLogDateStr(log.time)));
            
            let html = '';
            for (let i = 14; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;
                
                const isSelected = (dateStr === appState.selectedDate);
                const hasData = datesWithData.has(dateStr);
                
                const bgClass = isSelected ? 'bg-brand' : 'bg-surface border border-gray-100';
                const textColor = isSelected ? 'text-white' : 'text-gray-800';
                const dayNameColor = isSelected ? 'text-gray-400' : 'text-gray-400';
                const dotHtml = hasData 
                    ? `<div class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-brand'} mt-1.5"></div>` 
                    : `<div class="w-1.5 h-1.5 mt-1.5"></div>`;

                html += `
                <button onclick="selectDate('${dateStr}')" class="flex flex-col items-center justify-center min-w-[56px] h-[72px] rounded-[1.2rem] ${bgClass} transition-all shrink-0 shadow-sm">
                    <span class="text-[9px] font-bold ${dayNameColor} uppercase tracking-wider">${dayNames[d.getDay()]}</span>
                    <span class="text-[18px] font-black ${textColor} leading-none mt-1">${d.getDate()}</span>
                    ${dotHtml}
                </button>
                `;
            }
            container.innerHTML = html;
            setTimeout(() => { container.scrollLeft = container.scrollWidth; }, 10);
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            const filteredLogs = appState.logs.filter(log => getLogDateStr(log.time) === appState.selectedDate);
            
            if (filteredLogs.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-48 text-gray-400">
                        <i data-lucide="inbox" class="w-8 h-8 mb-3 opacity-20"></i>
                        <p class="text-[13px] font-bold">この日の記録データはありません</p>
                    </div>`;
                return;
            }

            let html = '';
            filteredLogs.forEach(log => {
                let summariesHtml = log.summaries.map(s => `
                    <li class="text-[13px] text-gray-600 font-medium leading-relaxed mb-2 flex items-start gap-2">
                        <span class="w-1.5 h-1.5 bg-gray-300 rounded-full mt-1.5 shrink-0"></span>
                        <span>${s}</span>
                    </li>
                `).join('');

                html += `
                <div class="bg-surface rounded-3xl p-6 shadow-sm border border-gray-100/50 fade-in relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1.5 h-full bg-brand rounded-l-3xl opacity-10"></div>
                    
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-2">
                            <i data-lucide="file-audio" class="w-4 h-4 text-brand"></i>
                            <span class="text-[12px] font-black text-brand tracking-widest">${formatTimeHM(log.time)}</span>
                        </div>
                        <button onclick="deleteLogConfirm('${log.id}')" class="text-gray-300 hover:text-red-500 transition">
                            <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                        </button>
                    </div>
                    
                    <h3 class="text-[18px] font-black text-gray-900 mb-4 leading-snug">${log.title}</h3>
                    
                    <ul class="mb-5">
                        ${summariesHtml}
                    </ul>
                    
                    <div class="flex gap-2">
                        <button onclick="toggleSection('details-${log.id}')" class="flex-1 bg-gray-50 hover:bg-gray-100 text-gray-700 text-[12px] font-bold py-2.5 rounded-xl transition flex justify-center items-center gap-1.5">
                            <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 議事録
                        </button>
                        <button onclick="toggleSection('transcript-${log.id}')" class="flex-1 bg-gray-50 hover:bg-gray-100 text-gray-700 text-[12px] font-bold py-2.5 rounded-xl transition flex justify-center items-center gap-1.5">
                            <i data-lucide="align-left" class="w-3.5 h-3.5"></i> 全文
                        </button>
                    </div>

                    <div id="details-${log.id}" class="hidden mt-3 p-4 bg-gray-50 rounded-2xl border border-gray-100">
                        <p class="text-[13px] text-gray-700 font-medium leading-relaxed whitespace-pre-wrap">${log.details || '詳細なし'}</p>
                    </div>
                    <div id="transcript-${log.id}" class="hidden mt-3 p-5 bg-brand rounded-2xl">
                        <p class="text-[13px] text-gray-300 font-medium leading-relaxed whitespace-pre-wrap">${log.fullTranscript}</p>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderTasks() {
            const container = document.getElementById('tasks-container');
            const badge = document.getElementById('task-badge');
            
            let allTasks = [];
            appState.logs.forEach(log => {
                log.tasks.forEach(t => {
                    allTasks.push({ ...t, sourceTitle: log.title, sourceTime: log.time, logId: log.id });
                });
            });

            const incompleteCount = allTasks.filter(t => !t.completed).length;
            if (incompleteCount > 0) {
                badge.innerText = incompleteCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            if (allTasks.length === 0) {
                container.innerHTML = '<div class="p-8 text-center text-[13px] text-gray-400 font-bold bg-surface">未完了のタスクはありません</div>';
                return;
            }

            let html = '';
            allTasks.forEach(task => {
                const checkedAttr = task.completed ? 'checked' : '';
                const textStyle = task.completed ? 'line-through text-gray-400' : 'text-gray-800 font-bold';
                
                html += `
                <div class="flex items-center justify-between p-5 border-b border-gray-50 hover:bg-gray-50 transition group">
                    <label class="flex items-start gap-4 flex-1 cursor-pointer">
                        <input type="checkbox" ${checkedAttr} onchange="toggleTask('${task.id}')" class="mt-0.5 w-5 h-5 text-brand rounded-full border-gray-300 focus:ring-brand">
                        <div>
                            <span class="text-[14px] block mb-1 ${textStyle} leading-snug">${task.text}</span>
                            <span class="text-[10px] text-gray-400 font-bold tracking-wider uppercase flex items-center gap-1">
                                ${task.sourceTitle}
                            </span>
                        </div>
                    </label>
                    <button onclick="deleteTaskConfirm('${task.logId}', '${task.id}')" class="p-2 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-full transition">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>`;
            });
            container.innerHTML = html;
        }

        // --- 操作ロジック ---
        function toggleSection(sectionId) {
            document.getElementById(sectionId).classList.toggle('hidden');
        }

        function toggleTask(taskId) {
            appState.logs.forEach(log => {
                log.tasks.forEach(t => {
                    if (t.id === taskId) t.completed = !t.completed;
                });
            });
            saveData();
        }

        function deleteTaskConfirm(logId, taskId) {
            if(confirm('このタスクを削除しますか？')) {
                const log = appState.logs.find(l => l.id === logId);
                if (log) {
                    log.tasks = log.tasks.filter(t => t.id !== taskId);
                    saveData();
                }
            }
        }

        function deleteLogConfirm(logId) {
            if(confirm('このノートを完全に削除しますか？')) {
                appState.logs = appState.logs.filter(l => l.id !== logId);
                saveData();
            }
        }
    </script>
</body>
</html>
