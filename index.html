<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BizLog - AI Voice Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        brand: '#1C1C1E',
                        accent: '#FF3B30',
                        bg: '#F2F2F7',
                        surface: '#FFFFFF' 
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-bg flex justify-center text-gray-900 h-screen overflow-hidden antialiased" onload="initApp()">
    <div class="w-full max-w-md bg-bg h-full flex flex-col relative shadow-2xl overflow-hidden">
        
        <header class="pt-12 pb-3 px-6 bg-surface z-20 shrink-0 rounded-b-3xl shadow-sm relative">
            <div class="flex items-center justify-between mb-5">
                <div>
                    <h1 class="text-[22px] font-black tracking-tight text-brand">BizLog</h1>
                    <p class="text-[11px] font-bold text-gray-400 tracking-wider mt-0.5 uppercase">Gemini 2.5 × GAS Background</p>
                </div>
                <button onclick="openSettingsModal()" class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center hover:bg-gray-100 transition shadow-sm border border-gray-100">
                    <i data-lucide="settings" class="w-5 h-5 text-gray-600"></i>
                </button>
            </div>
            <div class="flex overflow-x-auto no-scrollbar gap-2.5 pb-2" id="calendar-container"></div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar flex flex-col relative p-5 pb-32">
            <div class="bg-surface rounded-3xl p-6 shadow-sm border border-gray-100 text-center text-gray-500">
                <i data-lucide="info" class="w-6 h-6 mx-auto mb-2 text-gray-400"></i>
                <p class="text-[13px] font-bold">音声送信後の重い処理は、すべてGoogleサーバー（GAS）が裏側で自動実行します。</p>
                <p class="text-[11px] text-gray-400 mt-2">処理が完了すると、自動的にGoogleドライブに文字起こし文書が保存され、カレンダー・ToDoに同期されます。</p>
            </div>
        </main>

        <div class="absolute bottom-8 left-0 right-0 flex justify-center z-30 pointer-events-none">
            <button onclick="openMemoModal()" class="pointer-events-auto flex items-center gap-2.5 bg-brand text-white px-7 py-4 rounded-full shadow-2xl shadow-brand/40 hover:scale-105 active:scale-95 transition-all">
                <i data-lucide="plus" class="w-5 h-5"></i>
                <span class="text-[15px] font-bold tracking-wide">録音ファイルを送信</span>
            </button>
        </div>

        <div id="memo-modal" class="fixed inset-0 bg-brand/40 z-50 hidden flex flex-col justify-end backdrop-blur-md">
            <div id="memo-modal-content" class="bg-surface w-full max-w-md mx-auto rounded-t-[2.5rem] p-7 transform translate-y-full transition-transform duration-300 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-black text-brand tracking-tight">音声アップロード</h2>
                    <button onclick="closeMemoModal()" class="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
                        <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                    </button>
                </div>
                
                <div class="mb-5">
                    <div class="relative bg-gray-50 border-2 border-dashed border-gray-200 rounded-3xl p-6 hover:bg-gray-100 transition cursor-pointer flex flex-col items-center justify-center group" onclick="document.getElementById('audio-file').click()">
                        <div class="w-14 h-14 bg-white rounded-full shadow-sm border border-gray-100 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                            <i data-lucide="upload-cloud" id="upload-icon" class="w-6 h-6 text-brand"></i>
                        </div>
                        <span class="text-[14px] font-bold text-gray-700 text-center" id="file-name-display">音声ファイルを選択</span>
                        <input type="file" id="audio-file" accept="audio/*,.m4a,.mp4,.mp3,.wav" class="hidden" onchange="handleFileSelect(this)">
                    </div>
                </div>
                
                <div id="loading-indicator" class="hidden flex-col items-center justify-center gap-3 py-4 mb-2">
                    <div class="w-10 h-10 border-4 border-gray-200 border-t-brand rounded-full animate-spin"></div>
                    <span id="loading-text" class="text-[13px] font-bold text-brand text-center">音声送信中...</span>
                    <p id="loading-subtext" class="text-[11px] text-gray-400 text-center leading-relaxed"></p>
                </div>

                <div id="memo-buttons" class="flex">
                    <button onclick="analyzeData()" class="w-full bg-brand text-white font-bold py-4 rounded-2xl text-[15px] shadow-lg flex justify-center items-center gap-2">
                        <i data-lucide="send" class="w-5 h-5"></i> Googleサーバーへ送信
                    </button>
                </div>
            </div>
        </div>

        <div id="settings-modal" class="fixed inset-0 bg-brand/40 z-50 hidden flex flex-col justify-end backdrop-blur-md">
            <div id="settings-modal-content" class="bg-surface w-full max-w-md mx-auto rounded-t-[2.5rem] p-7 transform translate-y-full transition-transform duration-300 h-[80vh] flex flex-col shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-black text-brand tracking-tight">設定</h2>
                    <button onclick="closeSettingsModal()" class="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
                        <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                    </button>
                </div>
                
                <div class="flex-1 overflow-y-auto no-scrollbar space-y-6 pb-6">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 mb-2">使用するモデル (Gemini 2.5推奨)</label>
                        <select id="api-model-select" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-sm font-bold text-gray-700 focus:outline-none">
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash (高速・標準)</option>
                            <option value="gemini-2.5-pro">Gemini 2.5 Pro (超高性能・超長文向け)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 mb-2">GEMINI API KEY (必須)</label>
                        <input type="password" id="api-key-input" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-sm focus:outline-none" placeholder="AQ.xxx...">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 mb-2">連携: GOOGLE APP SCRIPT URL (必須)</label>
                        <input type="text" id="gas-url-input" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-sm focus:outline-none" placeholder="https://script.google.com/...">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 mb-2">連携: SECRET TOKEN (合言葉)</label>
                        <input type="password" id="gas-secret-input" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-sm focus:outline-none" placeholder="設定した合言葉">
                    </div>
                </div>

                <div class="pt-4 mt-auto">
                    <button onclick="saveSettings()" class="w-full bg-brand text-white font-bold py-4 rounded-2xl text-[15px] shadow-lg">設定を保存</button>
                </div>
            </div>
        </div>

        <div id="toast" class="fixed top-14 left-1/2 transform -translate-x-1/2 bg-brand text-white text-[13px] font-bold px-6 py-3.5 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 z-[100]"></div>
    </div>

    <script>
        let appState = { apiKey: '', modelName: 'gemini-2.5-flash', gasUrl: '', gasSecret: '' };
        let selectedFileObj = null;

        function initApp() {
            appState.apiKey = localStorage.getItem('bizlog_apikey') || '';
            appState.modelName = localStorage.getItem('bizlog_model') || 'gemini-2.5-flash';
            appState.gasUrl = localStorage.getItem('bizlog_gas_url') || '';
            appState.gasSecret = localStorage.getItem('bizlog_gas_secret') || '';
            
            // カレンダーヘッダーのみ簡易生成
            const container = document.getElementById('calendar-container');
            let html = '';
            for (let i = 4; i >= 0; i--) {
                const d = new Date(); d.setDate(d.getDate() - i);
                const isToday = i === 0;
                html += `<div class="flex flex-col items-center justify-center min-w-[56px] h-[72px] rounded-[1.2rem] ${isToday ? 'bg-brand text-white' : 'bg-surface border border-gray-100'} shrink-0 shadow-sm">
                    <span class="text-[18px] font-black">${d.getDate()}</span>
                </div>`;
            }
            container.innerHTML = html;
            if(!appState.apiKey || !appState.gasUrl) setTimeout(() => openSettingsModal(), 500);
        }

        // 各種モーダル
        function openSettingsModal() {
            document.getElementById('api-key-input').value = appState.apiKey;
            document.getElementById('api-model-select').value = appState.modelName;
            document.getElementById('gas-url-input').value = appState.gasUrl;
            document.getElementById('gas-secret-input').value = appState.gasSecret;
            document.getElementById('settings-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('settings-modal-content').classList.remove('translate-y-full'), 10);
        }
        function closeSettingsModal() {
            document.getElementById('settings-modal-content').classList.add('translate-y-full');
            setTimeout(() => document.getElementById('settings-modal').classList.add('hidden'), 300);
        }
        function saveSettings() {
            appState.apiKey = document.getElementById('api-key-input').value.trim();
            appState.modelName = document.getElementById('api-model-select').value;
            appState.gasUrl = document.getElementById('gas-url-input').value.trim();
            appState.gasSecret = document.getElementById('gas-secret-input').value.trim();
            localStorage.setItem('bizlog_apikey', appState.apiKey);
            localStorage.setItem('bizlog_model', appState.modelName);
            localStorage.setItem('bizlog_gas_url', appState.gasUrl);
            localStorage.setItem('bizlog_gas_secret', appState.gasSecret);
            closeSettingsModal();
        }
        function openMemoModal() {
            resetFileInput();
            document.getElementById('memo-buttons').classList.remove('hidden');
            document.getElementById('loading-indicator').classList.add('hidden');
            document.getElementById('memo-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('memo-modal-content').classList.remove('translate-y-full'), 10);
        }
        function closeMemoModal() {
            document.getElementById('memo-modal-content').classList.add('translate-y-full');
            setTimeout(() => document.getElementById('memo-modal').classList.add('hidden'), 300);
        }
        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                selectedFileObj = input.files[0];
                document.getElementById('file-name-display').innerHTML = `<span class="text-brand font-black">${selectedFileObj.name}</span>`;
            }
        }
        function resetFileInput() { selectedFileObj = null; document.getElementById('file-name-display').textContent = '音声ファイルを選択'; }

        // --- アップロード ＆ GASへの丸投げ処理 ---
        async function analyzeData() {
            if (!selectedFileObj) { alert("音声ファイルを選択してください。"); return; }

            document.getElementById('memo-buttons').classList.add('hidden');
            document.getElementById('loading-indicator').classList.remove('hidden');
            document.getElementById('loading-indicator').classList.add('flex');
            
            const loadingText = document.getElementById('loading-text');
            const loadingSub = document.getElementById('loading-subtext');

            try {
                // 裏で音声の再生時間を取得（20分刻みのループ処理に必要）
                let durationMinutes = 30; // 予備
                try {
                    const audio = document.createElement('audio');
                    audio.src = URL.createObjectURL(selectedFileObj);
                    await new Promise((resolve) => {
                        audio.addEventListener('loadedmetadata', () => {
                            durationMinutes = Math.ceil(audio.duration / 60);
                            resolve();
                        });
                        setTimeout(resolve, 2000); // 念のためのタイムアウト
                    });
                } catch(e){}

                loadingText.innerText = "① 音声ファイルを送信中...";
                loadingSub.innerText = "GoogleのAIサーバーへ直接アップロードしています。";

                const mimeType = selectedFileObj.type || (selectedFileObj.name.toLowerCase().endsWith('.m4a') ? 'audio/mp4' : 'audio/mp3');
                const uploadUrl = `https://generativelanguage.googleapis.com/upload/v1beta/files?key=${appState.apiKey}`;
                
                const uploadResponse = await fetch(uploadUrl, {
                    method: 'POST',
                    headers: {
                        'X-Goog-Upload-Protocol': 'raw',
                        'X-Goog-Upload-Command': 'start, upload, finalize',
                        'X-Goog-Upload-Header-Content-Length': selectedFileObj.size.toString(),
                        'X-Goog-Upload-Header-Content-Type': mimeType,
                        'Content-Type': mimeType
                    },
                    body: selectedFileObj
                });

                const uploadResult = await uploadResponse.json();
                if (!uploadResponse.ok) throw new Error(`送信失敗: ${uploadResult.error?.message}`);
                
                const fileUri = uploadResult.file.uri;

                loadingText.innerText = "② 送信完了！処理を委託中...";
                loadingSub.innerHTML = "裏側のGASへデータを引き渡しています。";

                // GASに「あとは全部裏でやっといて！」とデータを丸投げする
                fetch(appState.gasUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        secretToken: appState.gasSecret,
                        fileUri: fileUri,
                        mimeType: mimeType,
                        durationMinutes: durationMinutes,
                        geminiKey: appState.apiKey,
                        modelName: appState.modelName
                    })
                });

                // GASへの送信指示が完了したため、スマホ側はここで「おしまい」にして閉じて良い！
                alert("✨ 音声の送信に成功しました！\n\nスマホの画面を今すぐ閉じて（スリープさせて）大丈夫です。数分後に自動的にGoogleドライブ、カレンダー、ToDoにすべて反映されます。");
                closeMemoModal();

            } catch (error) {
                alert(`エラーが発生しました: ${error.message}`);
                document.getElementById('memo-buttons').classList.remove('hidden');
                document.getElementById('loading-indicator').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
